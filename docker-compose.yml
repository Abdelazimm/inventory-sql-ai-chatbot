version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory-sql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-sql-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/inventory_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-mock-key}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_123456789}
      APP_ENV: production
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://localhost"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory-sql-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
